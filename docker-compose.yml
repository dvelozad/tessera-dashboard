services:
  postgres:
    image: postgres:15-alpine
    container_name: tessera-postgres
    environment:
      POSTGRES_USER: mdrepo
      POSTGRES_PASSWORD: mdrepo_dev_password
      POSTGRES_DB: mdrepo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdrepo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-api
    env_file: .env
    command: uvicorn mddatalake.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - tessera_hot:/var/lib/tessera/hot
      - tessera_staging:/var/lib/tessera/staging
      # rclone credentials stay outside the image and outside git
      - ${RCLONE_CONFIG_DIR:-${HOME}/.config/rclone}:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Pushes queued artifacts from the hot cache to Google Drive. Runs as a
  # separate process so a slow upload never blocks the API.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-worker
    env_file: .env
    command: tessera worker
    volumes:
      - ./src:/app/src
      - tessera_hot:/var/lib/tessera/hot
      - tessera_staging:/var/lib/tessera/staging
      - ${RCLONE_CONFIG_DIR:-${HOME}/.config/rclone}:/root/.config/rclone:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tessera-frontend
    environment:
      VITE_API_URL: http://api:8000
      VITE_MDSERV_BASE: http://localhost:8090
    ports:
      - "3000:80"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: tessera-nginx
    ports:
      # Single entry point for the dashboard + API.
      # Reached over the tailnet at http://bigmsi.tail500ddf.ts.net:8420
      - "${TESSERA_HTTP_PORT:-8420}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  tessera_hot:
  tessera_staging:
